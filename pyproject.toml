# Strata LLM 引擎包定义
# 说明：
#   - 这是引擎自身的 Python 包元信息
#   - 让 `python -m engines.strata_llm_7c4f2b91.server` 能正确解析包结构
#   - 引擎运行依赖由 envs/llm-strata/ 提供，这里不重复声明
#   - 真正的推理由外部二进制 strata.exe（STRATA_BINS_DIR）承担，
#     本包不含 torch/diffusers 依赖

[project]
name = "strata-llm-engine"
version = "0.1.0"
description = "AIReliable Strata LLM 引擎（Qwen3.8-Flash-Next / 125B MoE GGUF 运行引擎）"
requires-python = ">=3.10,<3.13"

# 引擎运行依赖在 envs/llm-strata/pyproject.toml 中声明
# 这里不重复声明，避免双重锁定版本
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engines"]

# ===== 测试配置 =====
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
